<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#1f3b73;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.logout-box{
    background:white;
    width:420px;
    padding:40px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.logout-box h1{
    color:#1f3b73;
    margin-bottom:10px;
    font-size:38px;
    line-height:1.2;
}

.logout-box p{
    color:#555;
    margin-bottom:30px;
    font-size:18px;
}

.logout-btn{
    width:100%;
    padding:14px;
    background:#dc3545; /* red button */
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.logout-btn:hover{
    background:#bb2d3b;
}

.cancel-link{
    display:block;
    margin-top:18px;
    color:#1f3b73;
    text-decoration:none;
    font-weight:bold;
}

.cancel-link:hover{
    text-decoration:underline;
}

</style>

</head>
<body>

<div class="logout-box">


<h1>Employee Management System</h1>

<p>Are you sure you want to logout?</p>

<!-- Logout button -->
<form action="{{ url_for('do_logout') }}" method="POST">
    <button type="submit" class="logout-btn">Logout</button>
</form>

<!-- Cancel -->
<a href="javascript:history.back()" class="cancel-link">Cancel</a>


</div>

</body>
</html>
