<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

```
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins', sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#1f3b73,#355ca8);
        padding:20px;
    }

    .forgot-box{
        width:100%;
        max-width:450px;
        background:#fff;
        border-radius:22px;
        padding:40px;
        box-shadow:0 18px 40px rgba(0,0,0,0.18);
        text-align:center;
    }

    .icon{
        width:90px;
        height:90px;
        border-radius:50%;
        background:#e8eefc;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:0 auto 20px;
        font-size:42px;
        color:#1f3b73;
    }

    h1{
        color:#1f3b73;
        font-size:2rem;
        margin-bottom:10px;
    }

    p{
        color:#64748b;
        font-size:15px;
        line-height:1.6;
        margin-bottom:28px;
    }

    .form-group{
        text-align:left;
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        margin-bottom:8px;
        color:#374151;
        font-weight:500;
    }

    .form-group input{
        width:100%;
        padding:14px;
        border:1px solid #d1d5db;
        border-radius:14px;
        font-size:15px;
        transition:0.3s;
        background:#fff;
    }

    .form-group input:focus{
        outline:none;
        border-color:#355ca8;
        box-shadow:0 0 0 4px rgba(53,92,168,0.15);
    }

    .btn{
        width:100%;
        padding:14px;
        border:none;
        border-radius:14px;
        background:linear-gradient(135deg,#1f3b73,#355ca8);
        color:white;
        font-size:16px;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    .btn:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 22px rgba(31,59,115,0.25);
    }

    .back-link{
        display:inline-block;
        margin-top:20px;
        color:#355ca8;
        text-decoration:none;
        font-weight:600;
    }

    .back-link:hover{
        text-decoration:underline;
    }

    @media(max-width:500px){

        .forgot-box{
            padding:28px 22px;
        }

        h1{
            font-size:1.7rem;
        }
    }

</style>
```

</head>

<body>

```
<div class="forgot-box">

    <div class="icon">🔐</div>

    <h1>Forgot Password</h1>

    <p>
        Enter your registered email address. We will generate an OTP
        so you can reset your password securely.
    </p>

    <form action="/send-otp" method="POST">

        <div class="form-group">
            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <button type="submit" class="btn">
            Send OTP
        </button>

    </form>

    <a href="{{ url_for('login_page') }}" class="back-link">
        ← Back to Login
    </a>

</div>
```

</body>
</html>
