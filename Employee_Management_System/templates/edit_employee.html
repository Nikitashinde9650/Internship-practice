<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Employee</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.edit-box{
    width:450px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    color:#1f3b73;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#1f3b73;
    box-shadow:0 0 5px rgba(31,59,115,0.25);
}

button{
    width:100%;
    padding:13px;
    background:#1f3b73;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2d5ca6;
}

.back{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#1f3b73;
    text-decoration:none;
    font-weight:bold;
}

.back:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="edit-box">

<h2>Edit Employee</h2>

<form action="{{ url_for('update_employee', id=employee.id) }}" method="POST">

    <label>Employee Name</label>
    <input type="text" name="ename" value="{{ employee.ename }}" required>

    <label>Department</label>
    <input type="text" name="department" value="{{ employee.department }}" required>

    <label>Salary</label>
    <input type="number" name="salary" value="{{ employee.salary }}" required>

    <label>Email</label>
    <input type="email" name="email" value="{{ employee.email }}" required>

    <label>City</label>
    <input type="text" name="city" value="{{ employee.city }}" required>

    <button type="submit">Update Employee</button>

</form>

<a href="{{ url_for('employees_page') }}" class="back">← Back to Employees</a>

</div>

</body>
</html>
