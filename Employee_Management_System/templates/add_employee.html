<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Employee</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#1f3b73,#355ca8);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container-box{
    width:100%;
    max-width:1000px;
    background:white;
    padding:40px;
    border-radius:26px;
    box-shadow:0 18px 40px rgba(0,0,0,0.18);
}

h2{
    text-align:center;
    color:#1f3b73;
    margin-bottom:30px;
    font-size:2.3rem;
    font-weight:700;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full-width{
    grid-column:1 / -1;
}

label{
    margin-bottom:8px;
    font-weight:600;
    color:#374151;
    font-size:15px;
}

input,
select{
    width:100%;
    padding:14px 16px;
    border:1px solid #d1d5db;
    border-radius:16px;
    font-size:15px;
    transition:0.3s;
    background:#fff;
}

input:focus,
select:focus{
    outline:none;
    border-color:#355ca8;
    box-shadow:0 0 0 4px rgba(53,92,168,0.15);
    transform:translateY(-1px);
}

.button-row{
    grid-column:1 / -1;
    display:flex;
    gap:15px;
    margin-top:10px;
}

button{
    flex:1;
    padding:15px;
    background:linear-gradient(135deg,#1f3b73,#355ca8);
    color:white;
    border:none;
    border-radius:16px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(31,59,115,0.25);
}

.back-btn{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    border:2px solid #355ca8;
    color:#355ca8;
    border-radius:16px;
    font-weight:600;
    transition:0.3s;
}

.back-btn:hover{
    background:#355ca8;
    color:white;
}

@media(max-width:768px){

.container-box{
    padding:28px 22px;
}

.form-grid{
    grid-template-columns:1fr;
}

.button-row{
    flex-direction:column;
}

h2{
    font-size:1.9rem;
}

}

</style>

</head>

<body>

<div class="container-box">

<h2>Add Employee</h2>

<form action="/save-employee" method="POST">

    <div class="form-grid">

        <div class="form-group">
            <label>Employee Name</label>
            <input type="text" name="ename" placeholder="Enter Employee Name" required>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" name="department" placeholder="Enter Department" required>
        </div>

        <div class="form-group">
            <label>Salary</label>
            <input type="number" name="salary" placeholder="Enter Salary" required>
        </div>

        <div class="form-group">
            <label>Joining Date</label>
            <input type="date" name="joining_date" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter Email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter Password" required>
        </div>

        <div class="form-group">
            <label>City</label>
            <input type="text" name="city" placeholder="Enter City" required>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select name="status" required>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>

        <div class="button-row">
            <button type="submit">Add Employee</button>

            <a href="{{ url_for('admin_dashboard') }}" class="back-btn">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</form>

</div>

</body>
</html>
