<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reports</title>

<style>

body{

font-family:Arial;

background:#f4f6f9;

margin:0;

}

.container{

width:90%;

margin:40px auto;

}

h1{

color:#1d3d77;

}

.cards{

display:flex;

gap:20px;

margin-top:30px;

}

.card{

flex:1;

background:white;

padding:30px;

text-align:center;

box-shadow:0 0 10px lightgray;

border-radius:10px;

}

.card h2{

color:#1d3d77;

}

.card h1{

font-size:45px;

}

.back-btn{

display:inline-block;

margin-top:20px;

background:#1d3d77;

color:white;

padding:10px 20px;

text-decoration:none;

border-radius:5px;

}

</style>

</head>

<body>

<div class="container">

<h1>Reports Dashboard</h1>

<a href="/dashboard" class="back-btn">
← Dashboard
</a>

<div class="cards">

<div class="card">

<h2>Total Employees</h2>

<h1>{{total_employees}}</h1>

</div>

<div class="card">

<h2>Total Users</h2>

<h1>{{total_users}}</h1>

</div>

</div>

</div>

</body>

</html>
