<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">

    <style>

        .password-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .password-card {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .password-card h1 {
            margin-bottom: 8px;
        }

        .password-card p {
            margin-bottom: 25px;
            color: #64748b;
        }

        .password-group {
            margin-bottom: 20px;
        }

        .password-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .password-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .password-group input:focus {
            outline: none;
            border-color: #355ca8;
            box-shadow: 0 0 0 3px rgba(53,92,168,0.12);
        }

        .change-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #355ca8;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .change-btn:hover {
            background: #1f3b73;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #355ca8;
            font-weight: 600;
        }

    </style>

</head>


<body>


<div class="password-page">


    <div class="password-card">


        <h1>🔒 Change Password</h1>

        <p>
            Update your account password securely.
        </p>


        <form
            action="{{ url_for('change_password') }}"
            method="POST">


            <!-- Current Password -->

            <div class="password-group">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    name="old_password"
                    placeholder="Enter current password"
                    required>

            </div>


            <!-- New Password -->

            <div class="password-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required>

            </div>


            <!-- Confirm Password -->

            <div class="password-group">

                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required>

            </div>


            <button
                type="submit"
                class="change-btn">

                🔑 Change Password

            </button>


        </form>


        <a
            href="{{ url_for('user_dashboard') }}"
            class="back-btn">

            ← Back to Dashboard

        </a>


    </div>


</div>


<!-- Flash Message Popup -->

{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        {% for category, message in messages %}

            <script>

                alert({{ message | tojson }});

            </script>

        {% endfor %}

    {% endif %}

{% endwith %}


</body>

</html>
