<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>


    <!-- Existing Dashboard CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">


</head>


<body>


<div class="container">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div class="sidebar">


        <!-- EMS Logo / Name -->

        <h2>EMS</h2>


        <ul>


            <!-- ================= DASHBOARD ================= -->

            <li>

                <a href="{{ url_for('user_dashboard') }}">

                    🏠 Dashboard

                </a>

            </li>



            <!-- ================= MY PROFILE ================= -->

            <li>

                <a href="{{ url_for('my_profile') }}">

                    👤 My Profile

                </a>

            </li>



            <!-- ================= CHANGE PASSWORD ================= -->

            <li>

                <a href="{{ url_for('change_password_page') }}">

                    🔒 Change Password

                </a>

            </li>



            <!-- ================= LOGOUT ================= -->

            <li>

                <a href="{{ url_for('logout') }}">

                    🚪 Logout

                </a>

            </li>


        </ul>


    </div>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <div class="main-content">


        <!-- ================= HEADER ================= -->

        <div class="header">

            <h1>User Dashboard</h1>

        </div>



        <!-- ================= WELCOME BOX ================= -->

        <div class="welcome-box">


            <h2>

                Welcome {{ session.get('user_name') }} 👋

            </h2>


            <p>

                You have successfully logged in as User.

            </p>


        </div>



        <!-- =================================================
             USER CARDS
        ================================================== -->

        <div class="cards">


            <!-- ================= MY ACCOUNT ================= -->

            <div class="card">


                <h3>

                    My Account

                </h3>


                <h1>

                    👤

                </h1>


            </div>



            <!-- ================= USER ROLE ================= -->

            <div class="card">


                <h3>

                    Role

                </h3>


                <h1>

                    {{ session.get('role') }}

                </h1>


            </div>


        </div>



        <!-- =================================================
             CHARTS
        ================================================== -->

        <div class="chart-container">


            <!-- ================= BAR CHART ================= -->

            <div class="chart-box">


                <h2>

                    Employees by Department

                </h2>


                <canvas id="employeeBarChart"></canvas>


            </div>



            <!-- ================= PIE CHART ================= -->

            <div class="chart-box">


                <h2>

                    Department Distribution

                </h2>


                <canvas id="departmentPieChart"></canvas>


            </div>


        </div>


    </div>


</div>



<!-- =====================================================
     CHART JS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>



<script>


/* =====================================================
   DEPARTMENT DATA FROM FLASK
===================================================== */

const labels = {{ labels | tojson }};

const counts = {{ counts | tojson }};



/* =====================================================
   EMPLOYEE BAR CHART
===================================================== */

new Chart(

    document.getElementById('employeeBarChart'),

    {

        type: 'bar',

        data: {

            labels: labels,

            datasets: [

                {

                    data: counts,

                    backgroundColor: [

                        '#14b8a6',

                        '#6366f1',

                        '#f59e0b',

                        '#ef4444',

                        '#10b981'

                    ]

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: true,

            plugins: {

                legend: {

                    display: false

                }

            }

        }

    }

);



/* =====================================================
   DEPARTMENT PIE CHART
===================================================== */

new Chart(

    document.getElementById('departmentPieChart'),

    {

        type: 'pie',

        data: {

            labels: labels,

            datasets: [

                {

                    data: counts,

                    backgroundColor: [

                        '#14b8a6',

                        '#6366f1',

                        '#f59e0b',

                        '#ef4444',

                        '#10b981'

                    ]

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: true

        }

    }

);


</script>



</body>

</html>
