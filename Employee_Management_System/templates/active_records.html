<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Records</title>

    <style>

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:30px;
        }

        .container{
            max-width:1000px;
            margin:auto;
        }

        h2{
            text-align:center;
            background:#1f3b73;
            color:white;
            padding:15px;
            border-radius:10px;
            margin-bottom:25px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 2px 8px rgba(0,0,0,0.15);
        }

        th{
            background:#1f3b73;
            color:white;
            padding:14px;
            text-align:center;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        tr:hover{
            background:#e8f0ff;
        }

        .status-active{
            color:green;
            font-weight:bold;
        }

        .back-btn{
            display:inline-block;
            margin-top:20px;
            padding:10px 18px;
            background:#1f3b73;
            color:white;
            text-decoration:none;
            border-radius:6px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:#2d5ca6;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Active Employee Records</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>City</th>
            <th>Status</th>
        </tr>

        {% for emp in employees %}

        <tr>
            <td>{{ emp.id }}</td>
            <td>{{ emp.ename }}</td>
            <td>{{ emp.department }}</td>
            <td>{{ emp.city }}</td>
            <td class="status-active">{{ emp.status }}</td>
        </tr>

        {% endfor %}

    </table>

    <div style="text-align:center; margin-top:30px;">
    <a href="{{ url_for('admin_dashboard') if session.get('role') == 'admin' else url_for('user_dashboard') }}"
       style="
            display:inline-block;
            background:#1f3b73;
            color:white;
            padding:12px 22px;
            border-radius:8px;
            text-decoration:none;
            font-size:16px;
            font-weight:bold;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
            transition:0.3s;
       "
       onmouseover="this.style.background='#2d5ca6'"
       onmouseout="this.style.background='#1f3b73'">
        ← Back to Dashboard
    </a>
</div>
</div>

</body>
</html>
