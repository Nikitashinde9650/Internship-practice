<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:20px;
        }

        .container{
            width:95%;
            margin:auto;
        }

        h1{
            color:#1d3d77;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .back-btn{
            background:#1d3d77;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:5px;
        }

        .search-box{
            margin-bottom:20px;
        }

        .search-box input{
            width:300px;
            padding:10px;
            border:1px solid gray;
            border-radius:5px;
        }

        .search-box button{
            padding:10px 18px;
            background:#1d3d77;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .search-box button:hover{
            background:#16315e;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th{
            background:#1d3d77;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:nth-child(even){
            background:#f8f8f8;
        }

        .edit-btn{
            background:green;
            color:white;
            border:none;
            padding:8px 15px;
            border-radius:5px;
            cursor:pointer;
        }

        .edit-btn:hover{
            background:darkgreen;
        }

        .delete-btn{
            background:red;
            color:white;
            border:none;
            padding:8px 15px;
            border-radius:5px;
            cursor:pointer;
        }

        .delete-btn:hover{
            background:darkred;
        }

    </style>

</head>

<body>

<div class="container">

<div class="top-bar">

<h1>Employee List</h1>

<a href="/dashboard" class="back-btn">← Dashboard</a>

</div>

<div class="search-box">

<input
type="text"
id="search"
placeholder="Search Employee Name">

<button onclick="searchEmployee()">
Search
</button>

</div>

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Salary</th>
<th>Email</th>
<th>City</th>
<th>Action</th>

</tr>

</thead>

<tbody id="employeeTable">

{% for emp in employees %}

<tr>

<td>{{ emp.id }}</td>
<td>{{ emp.ename }}</td>
<td>{{ emp.department }}</td>
<td>{{ emp.salary }}</td>
<td>{{ emp.email }}</td>
<td>{{ emp.city }}</td>

<td>

<button
class="edit-btn"
onclick="editEmployee({{ emp.id }})">
Edit
</button>

<button
class="delete-btn"
onclick="deleteEmployee({{ emp.id }})">
Delete
</button>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<script>

function searchEmployee(){

let name=document.getElementById("search").value.trim();

fetch(`/search_employee?name=${encodeURIComponent(name)}`)

.then(response=>response.json())

.then(data=>{

let rows="";

if(data.length===0){

rows=`
<tr>
<td colspan="7">No Employee Found</td>
</tr>
`;

}
else{

data.forEach(emp=>{

rows+=`

<tr>

<td>${emp.id}</td>

<td>${emp.ename}</td>

<td>${emp.department}</td>

<td>${emp.salary}</td>

<td>${emp.email}</td>

<td>${emp.city}</td>

<td>

<button
class="edit-btn"
onclick="editEmployee(${emp.id})">

Edit

</button>

<button
class="delete-btn"
onclick="deleteEmployee(${emp.id})">

Delete

</button>

</td>

</tr>

`;

});

}

document.getElementById("employeeTable").innerHTML=rows;

});

}



function deleteEmployee(id){

if(confirm("Are you sure you want to delete this employee?")){

fetch(`/delete_employee/${id}`,{

method:"DELETE"

})

.then(response=>response.json())

.then(data=>{

alert(data.message);

location.reload();

});

}

}



function editEmployee(id){

localStorage.setItem("emp_id",id);

window.location.href="/edit_employee";

}

</script>

</body>
</html>
